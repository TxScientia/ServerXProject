name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, coverage and SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pylint pytest-cov

      - name: Run pylint
        run: pylint backend/app backend/tests --output-format=parseable --reports=no | tee backend/pylint-report.txt

      - name: Run backend tests with coverage
        run: pytest --cov=backend/app --cov-report=term-missing --cov-report=xml:backend/coverage.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run React lint
        working-directory: frontend
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0

      - name: Run React tests with coverage
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --coverage --coverageReporters=lcov

      - name: Build React app
        working-directory: frontend
        run: npm run build

      - name: Upload coverage and lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            backend/coverage.xml
            backend/pylint-report.txt
            frontend/coverage/lcov.info
          if-no-files-found: ignore

      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v5
