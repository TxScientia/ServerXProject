name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pylint pytest-cov

      - name: Run backend tests with coverage
        run: python -m pytest --cov=backend/app --cov-report=term-missing --cov-report=xml:backend/coverage.xml

      - name: Run pylint
        run: pylint --source-roots=. backend/app backend/tests --output-format=parseable --reports=no | tee backend/pylint-report.txt

      - name: Upload backend reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-quality-reports
          path: |
            backend/coverage.xml
            backend/pylint-report.txt
          if-no-files-found: ignore

  frontend-quality:
    name: Frontend build, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # The TypeScript build checks types; ESLint is not configured in this project.
      - name: Build frontend
        run: npm run build

      - name: Run frontend tests with coverage
        run: npm run test:ci -- --coverage --coverage.reporter=text --coverage.reporter=lcov

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
