sonar.projectKey=serverxproject
sonar.projectName=ServerXProject

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,frontend/build/**,frontend/coverage/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.pylint.reportPaths=backend/pylint-report.txt
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
